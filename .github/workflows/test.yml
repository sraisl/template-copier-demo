name: Demo-Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m unittest discover -s tests -v
  jdk-template:
    name: JDK-Template Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: JDK-Projekt erzeugen
        env:
          JAVA_VERSION: ${{ matrix.java }}
        run: |
          uv run python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from automation import parse_issue, render
          fields = parse_issue(Path('examples/preview-jdk.md').read_text())
          fields['Java-Version'] = os.environ['JAVA_VERSION']
          render(fields, Path('output/jdk'))
          PY
      - name: Maven-Build und JUnit-Tests
        working-directory: output/jdk
        run: mvn --batch-mode --no-transfer-progress verify
      - name: PolyScan-Integration prüfen
        if: matrix.java == '21'
        uses: sraisl/polyscan-action@c801894f046bf0a567e64cac309d95656713ad8f # v16.1.1
        with:
          target: 'output/jdk'
          engines: 'spotbugs'
          gate: 'true'
          fail-on-engine-error: 'true'
          sarif: 'true'
          upload-artifacts: 'true'
