name: Repository-Secret generieren
description: Zufälliges Demo-Secret im Ziel-Repository erstellen, ohne den Wert anzuzeigen.
title: "[config] Secret generieren"
body:
  - type: dropdown
    id: action
    attributes:
      label: Aktion
      options: [generate-secret]
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository-Name
      description: Repository beim konfigurierten TARGET_OWNER. Schreibrechte im Ziel sind erforderlich.
      placeholder: demo-service
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Secret-Name
      description: Bestehende Secrets werden nicht überschrieben. Kein Secret-Wert im Issue erforderlich.
      placeholder: DEMO_TOKEN
    validations:
      required: true
