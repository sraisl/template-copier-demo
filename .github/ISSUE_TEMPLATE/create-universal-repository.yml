name: Universelles Repository mit Reusable Workflow erstellen
description: Nur einen aufrufenden Workflow erzeugen und einen oder mehrere Typen übergeben.
title: "[repo] Universelles Projekt"
body:
  - type: dropdown
    id: action
    attributes:
      label: Aktion
      options: [preview, create]
    validations:
      required: true
  - type: input
    id: repository_name
    attributes:
      label: Repository-Name
      placeholder: demo-universal-service
    validations:
      required: true
  - type: dropdown
    id: visibility
    attributes:
      label: Sichtbarkeit
      options: [private, public]
    validations:
      required: true
  - type: dropdown
    id: template
    attributes:
      label: Vorlage
      options: [universal]
    validations:
      required: true
  - type: dropdown
    id: types
    attributes:
      label: Typen
      description: Einen oder mehrere Typen auswählen. Sie werden als JSON-Array im Input types übergeben.
      multiple: true
      options: [node, docker, spring-boot, spring-boot-buildpack]
    validations:
      required: true
  - type: input
    id: reusable_workflow
    attributes:
      label: Reusable Workflow
      description: Externer Workflow im Format OWNER/REPO/.github/workflows/DATEI.yml@REF. Er muss workflow_call mit String-Input types unterstützen und für das neue Repository zugänglich sein.
      value: sraisl/reusable-workflows/.github/workflows/ci.yml@main
    validations:
      required: true
  - type: dropdown
    id: jdk_home
    attributes:
      label: JDK_HOME
      description: Wird bei create als Actions-Variable im neuen Repository gesetzt.
      options: ["/opt/jdk-21", "/opt/jdk-25", "/opt/jdk-17"]
      default: 0
    validations:
      required: true
  - type: dropdown
    id: sonar
    attributes:
      label: Sonar konfigurieren
      description: Bei create SONAR_HOST_URL und das Factory-Secret SONAR_TOKEN im neuen Repository einrichten.
      options: ["yes", "no"]
      default: 0
    validations:
      required: true
  - type: input
    id: sonar_host_url
    attributes:
      label: SONAR_HOST_URL
      description: Bei aktivierter Sonar-Konfiguration erforderlich. Den Token niemals hier eintragen.
      placeholder: https://sonarqube.example.com
